<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012056">
<title>Início — App de Liderança</title>
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<main class="conteudo">
  <h1 class="saudacao" id="saudacao">
    <span class="esqueleto" style="display:inline-block;width:220px;height:26px"></span>
  </h1>
  <p class="saudacao-sub" id="saudacao-sub">&nbsp;</p>

  <h2 class="titulo-secao">Classes de liderança</h2>
  <div class="grade-cards" id="grade-classes">
    <div class="card"><div class="card-corpo" style="padding:20px">
      <div class="esqueleto" style="height:14px;width:60%;margin-bottom:12px"></div>
      <div class="esqueleto" style="height:8px;width:100%"></div>
    </div></div>
    <div class="card"><div class="card-corpo" style="padding:20px">
      <div class="esqueleto" style="height:14px;width:70%;margin-bottom:12px"></div>
      <div class="esqueleto" style="height:8px;width:100%"></div>
    </div></div>
    <div class="card"><div class="card-corpo" style="padding:20px">
      <div class="esqueleto" style="height:14px;width:55%;margin-bottom:12px"></div>
      <div class="esqueleto" style="height:8px;width:100%"></div>
    </div></div>
  </div>

  <div id="bloco-ferramentas" hidden>
    <h2 class="titulo-secao">Ferramentas</h2>
    <div class="grade-cards" id="grade-ferramentas"></div>
  </div>
</main>

<script type="module" src="js/inicio.js"></script>
</body>
</html>
